name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fullcycle .
      - run: test "$(docker run --rm fullcycle)" = "Full Cycle Rocks!"
      - name: Image must be under 2MB
        run: |
          size=$(docker image inspect fullcycle -f '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -le 2000000
